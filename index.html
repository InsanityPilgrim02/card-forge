<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Card Forge · OPR</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#14161a">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
</head>
<body>
<script>
Promise.all([0,1,2].map(i => fetch('app.' + i + '.html', {cache:'no-cache'}).then(r => {
  if (!r.ok) throw new Error('failed to load app.' + i + '.html');
  return r.text();
}))).then(parts => {
  document.open();
  document.write(parts.join(''));
  document.close();
}).catch(err => {
  document.body.textContent = 'Failed to load Card Forge: ' + err.message;
});
</script>
</body>
</html>
